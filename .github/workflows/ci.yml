name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: origins
          POSTGRES_PASSWORD: origins
          POSTGRES_DB: origins_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U origins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://origins:origins@localhost:5432/origins_test
      # Secrets de test uniquement (aucun lien avec la production)
      JWT_SECRET: ci-only-access-secret-not-used-in-production-0001
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-in-production-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:setup
      - run: npm test
